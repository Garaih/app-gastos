name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests y compilación debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-gastos-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar APK en la release "debug"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-gastos-debug.apk
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug app-gastos-debug.apk --prerelease \
            --title "APK de depuración (último main)" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Instalar en el móvil abriendo el APK."
